<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phase-Balancing Copilot</title>
<meta name="description" content="Dry-run simulator for the Panel Schedule and Phase-Balancing Copilot: audit panels, propose the fewest circuit moves, review and apply.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: project browser (levels and panels) on the left, working canvas on the right,
   presenter strip pinned to the bottom during a guided dry run.
   Palette: switchgear enclosure grey, copper bus, R-Y-B phase colours; teal marks the copilot's fix. */
:root {
  --ground: #E1E5E0;
  --chassis: #D2D8D2;
  --plate: #F8F9F6;
  --plate-2: #EEF1EC;
  --ink: #16201C;
  --ink-2: #47534E;
  --ink-3: #75807B;
  --rule: #C8CFC9;
  --rule-strong: #A7B1AA;
  --phase-a: #C8432B; --phase-a-ink: #A0311C; --phase-a-soft: #F2DBD4;
  --phase-b: #D89D14; --phase-b-ink: #7E5700; --phase-b-soft: #F4E7C4;
  --phase-c: #2C63BE; --phase-c-ink: #224F99; --phase-c-soft: #D8E2F3;
  --copper: #B46B34; --copper-hi: #DA9862; --copper-lo: #8A4D20;
  --fix: #0A7C74; --fix-ink: #076259; --fix-soft: #D2E9E5; --on-fix: #FFFFFF;
  --alarm: #B3173F; --alarm-soft: #F4D8DF;
  --warn: #A55100; --warn-soft: #F4E1CB;
  --lock: #56636B; --lock-soft: #E0E5E8;
  --shadow: 0 1px 0 rgba(22, 32, 28, .05), 0 1px 3px rgba(22, 32, 28, .10);
  --shadow-lift: 0 6px 18px rgba(22, 32, 28, .18);
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --t-xs: 11px; --t-sm: 12.5px; --t-base: 14px; --t-md: 16px; --t-lg: 20px; --t-xl: 28px; --t-2xl: 40px; --t-3xl: 60px;
  --r: 6px;
  --row: 50px;
  --bus: 120px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0F1513; --chassis: #1C2421; --plate: #19211E; --plate-2: #212A26;
    --ink: #E3E9E5; --ink-2: #A8B3AD; --ink-3: #76837D; --rule: #2C3733; --rule-strong: #3E4C46;
    --phase-a: #E2644C; --phase-a-ink: #F28C76; --phase-a-soft: #3A1E18;
    --phase-b: #E5B23C; --phase-b-ink: #F0C868; --phase-b-soft: #392C10;
    --phase-c: #4F8BEA; --phase-c-ink: #8AB1F3; --phase-c-soft: #172A47;
    --copper: #C98149; --copper-hi: #E7A774; --copper-lo: #8E5427;
    --fix: #2DB3A6; --fix-ink: #5FD0C4; --fix-soft: #12312D; --on-fix: #06201D;
    --alarm: #EE5A7F; --alarm-soft: #3B1520; --warn: #E89A3C; --warn-soft: #3A2810; --lock: #95A3AB; --lock-soft: #263036;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 1px 3px rgba(0, 0, 0, .4);
    --shadow-lift: 0 8px 22px rgba(0, 0, 0, .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0F1513; --chassis: #1C2421; --plate: #19211E; --plate-2: #212A26;
  --ink: #E3E9E5; --ink-2: #A8B3AD; --ink-3: #76837D; --rule: #2C3733; --rule-strong: #3E4C46;
  --phase-a: #E2644C; --phase-a-ink: #F28C76; --phase-a-soft: #3A1E18;
  --phase-b: #E5B23C; --phase-b-ink: #F0C868; --phase-b-soft: #392C10;
  --phase-c: #4F8BEA; --phase-c-ink: #8AB1F3; --phase-c-soft: #172A47;
  --copper: #C98149; --copper-hi: #E7A774; --copper-lo: #8E5427;
  --fix: #2DB3A6; --fix-ink: #5FD0C4; --fix-soft: #12312D; --on-fix: #06201D;
  --alarm: #EE5A7F; --alarm-soft: #3B1520; --warn: #E89A3C; --warn-soft: #3A2810; --lock: #95A3AB; --lock-soft: #263036;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 1px 3px rgba(0, 0, 0, .4);
  --shadow-lift: 0 8px 22px rgba(0, 0, 0, .55);
}

/* ---------- base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 400 var(--t-base)/1.5 var(--font-body);
  font-feature-settings: "ss02";
}
body.touring { padding-bottom: 168px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
table { border-collapse: collapse; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--fix); outline-offset: 2px; border-radius: 3px; }
.num, .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.tx-alarm { color: var(--alarm); }
.tx-fix { color: var(--fix-ink); }
.tx-warn { color: var(--warn); }
.tx-muted { color: var(--ink-3); }
.ph-A { --ph: var(--phase-a); --ph-ink: var(--phase-a-ink); --ph-soft: var(--phase-a-soft); }
.ph-B { --ph: var(--phase-b); --ph-ink: var(--phase-b-ink); --ph-soft: var(--phase-b-soft); }
.ph-C { --ph: var(--phase-c); --ph-ink: var(--phase-c-ink); --ph-soft: var(--phase-c-soft); }
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* engraved nameplate, like a traffolyte label on a panel door */
.plate {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--ink); color: var(--plate);
  font: 600 13px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase;
  padding: 5px 8px 4px; border-radius: 2px; white-space: nowrap;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
}
.plate::before, .plate::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); opacity: .8; }
.plate-lg { font-size: 15px; padding: 7px 10px 6px; }
.plate-xl { font-size: 26px; padding: 8px 14px 7px; letter-spacing: .06em; }

/* ---------- buttons and controls */
.btn {
  display: inline-flex; align-items: center; gap: 7px; min-height: 36px;
  padding: 7px 13px; border: 1px solid var(--rule-strong); border-radius: var(--r);
  background: var(--plate); color: var(--ink); font-weight: 500; font-size: var(--t-sm);
  cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--fix); border-color: var(--fix); color: var(--on-fix); }
.btn-primary:hover:not(:disabled) { background: var(--fix-ink); border-color: var(--fix-ink); }
.btn-ink { background: var(--ink); border-color: var(--ink); color: var(--plate); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover:not(:disabled) { background: var(--plate-2); border-color: var(--rule); }
.btn-sm { min-height: 28px; padding: 3px 9px; font-size: var(--t-xs); }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--rule-strong); border-radius: var(--r); background: var(--plate); cursor: pointer; }
.seg { display: inline-flex; padding: 2px; background: var(--plate-2); border: 1px solid var(--rule); border-radius: var(--r); }
.seg button {
  border: 0; background: transparent; padding: 6px 11px; border-radius: 4px; cursor: pointer;
  font-size: var(--t-sm); font-weight: 500; color: var(--ink-2); white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--plate); color: var(--ink); box-shadow: var(--shadow); }
.seg.small button { padding: 4px 9px; font-size: var(--t-xs); }
input[type="range"] { accent-color: var(--fix); width: 150px; }
input[type="number"], input[type="text"], select {
  font: 500 var(--t-sm) var(--font-data); color: var(--ink); background: var(--plate);
  border: 1px solid var(--rule-strong); border-radius: 4px; padding: 6px 8px; min-width: 0;
}
input[type="checkbox"] { accent-color: var(--fix); width: 16px; height: 16px; }

/* ---------- chips */
.chip {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font: 600 var(--t-xs)/1 var(--font-body); letter-spacing: .02em;
  padding: 4px 8px 4px 6px; border-radius: 999px; border: 1px solid transparent;
}
.chip .i { width: 13px; height: 13px; vertical-align: 0; }
.chip-unknown { color: var(--ink-3); border: 1px dashed var(--rule-strong); }
.chip-ok { color: var(--fix-ink); background: var(--fix-soft); }
.chip-over { color: var(--alarm); background: var(--alarm-soft); }
.chip-proposed { color: var(--fix-ink); border-color: var(--fix); background: var(--plate); }
.chip-accepted { color: var(--on-fix); background: var(--fix); }
.chip-applied { color: var(--plate); background: var(--ink); }
.chip-rejected { color: var(--ink-2); background: var(--plate-2); border-color: var(--rule); }
.chip-needs { color: var(--warn); background: var(--warn-soft); }
.chip-locked { color: var(--lock); background: var(--lock-soft); }

/* ---------- app frame */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  padding: 12px clamp(16px, 2.4vw, 28px);
  background: var(--plate); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; flex-wrap: wrap; }
.brand-meta { display: flex; flex-direction: column; line-height: 1.3; font-size: var(--t-sm); color: var(--ink-2); }
.brand-meta b { color: var(--ink); font-weight: 600; }
.dry { display: inline-flex; align-items: center; gap: 6px; color: var(--warn); font-weight: 500; }
.dry::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.pipeline { display: flex; align-items: center; gap: 0; margin: 0 0 0 auto; padding: 0; list-style: none; counter-reset: step; }
.pipeline li {
  counter-increment: step; display: flex; align-items: center; gap: 6px;
  font: 600 var(--t-sm)/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3);
  padding: 0 4px;
}
.pipeline li::before {
  content: counter(step); display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  border: 1.5px solid var(--rule-strong); font: 600 11px/1 var(--font-data); color: var(--ink-3); background: var(--plate);
}
.pipeline li + li::after { content: none; }
.pipeline .wire { width: 22px; height: 2px; background: var(--rule-strong); }
.pipeline li.done { color: var(--ink); }
.pipeline li.done::before { background: var(--fix); border-color: var(--fix); color: var(--on-fix); }
.pipeline li.now { color: var(--fix-ink); }
.pipeline li.now::before { border-color: var(--fix); color: var(--fix-ink); box-shadow: 0 0 0 3px var(--fix-soft); }
.pipeline .wire.done { background: var(--fix); }
.top-actions { display: flex; gap: 8px; align-items: center; }

.tabs {
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
  padding: 0 clamp(16px, 2.4vw, 28px); background: var(--plate); border-bottom: 1px solid var(--rule);
}
.tabs button {
  border: 0; background: none; cursor: pointer; padding: 11px 14px 10px; white-space: nowrap;
  font: 600 var(--t-md)/1 var(--font-display); letter-spacing: .02em; color: var(--ink-2);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--copper); }
.tabs .count { font: 500 var(--t-xs) var(--font-data); color: var(--ink-3); margin-left: 4px; }

.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); align-items: start; }
.browser {
  position: sticky; top: 112px; max-height: calc(100vh - 112px); overflow-y: auto;
  border-right: 1px solid var(--rule); background: var(--plate-2);
  padding-block: 14px 24px; padding-inline: 14px; display: flex; flex-direction: column; gap: 14px;
}
.main { padding-block: 22px 48px; padding-inline: clamp(16px, 2.4vw, 32px); min-width: 0; outline: none; }

/* ---------- project browser */
.pb-head { display: flex; justify-content: space-between; align-items: baseline; font: 600 var(--t-sm)/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.pb-head span { font: 500 var(--t-xs) var(--font-data); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.pb-level { display: flex; flex-direction: column; gap: 2px; }
.pb-level-name { font: 600 var(--t-xs)/1.2 var(--font-body); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; padding: 6px 6px 4px; }
.pb-item {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  width: 100%; padding: 6px 8px; border: 1px solid transparent; border-radius: var(--r); background: transparent; cursor: pointer; text-align: left;
}
.pb-item:hover { background: var(--plate); border-color: var(--rule); }
.pb-item[aria-current="true"] { background: var(--plate); border-color: var(--rule-strong); box-shadow: var(--shadow); }
.pb-item .plate { font-size: 11.5px; padding: 4px 6px 3px; gap: 5px; }
.pb-item .plate::before, .pb-item .plate::after { width: 3px; height: 3px; }
.pb-imb { font: 500 var(--t-sm) var(--font-data); text-align: right; }
.lamp { width: 9px; height: 9px; border-radius: 50%; background: var(--rule-strong); box-shadow: inset 0 -1px 1px rgba(0,0,0,.25); }
.lamp-ok, .lamp-applied, .lamp-accepted, .lamp-proposed { background: var(--fix); }
.lamp-over { background: var(--alarm); }
.lamp-needs { background: var(--warn); }
.lamp-locked { background: var(--lock); }
.lamp-proposed { box-shadow: 0 0 0 3px var(--fix-soft); }
.mini { display: inline-flex; align-items: flex-end; gap: 2px; height: 22px; width: 26px; }
.mini i { flex: 1; min-height: 2px; border-radius: 1px 1px 0 0; background: var(--ph); }
.mini.unknown i { background: var(--rule-strong); height: 40% !important; }
.pb-imb-wrap { display: flex; align-items: center; gap: 8px; }

.activity { border-top: 1px solid var(--rule); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.activity ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
.activity li { display: grid; grid-template-columns: 58px 1fr; gap: 6px; font-size: var(--t-xs); line-height: 1.4; color: var(--ink-2); }
.activity time { font-family: var(--font-data); color: var(--ink-3); }
.activity li.k-ok span { color: var(--fix-ink); }
.activity li.k-alarm span { color: var(--alarm); }
.activity li.k-warn span { color: var(--warn); }
.activity .empty { font-size: var(--t-xs); color: var(--ink-3); }

/* ---------- views: shared */
.view { display: flex; flex-direction: column; gap: 18px; }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
.eyebrow { font: 600 var(--t-xs)/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--copper); margin-bottom: 6px; }
.view-head h1 { font: 600 var(--t-2xl)/1 var(--font-display); letter-spacing: -.005em; }
.summary { margin-top: 8px; font-size: var(--t-md); color: var(--ink-2); max-width: 70ch; }
.summary b { color: var(--ink); font-weight: 600; font-family: var(--font-data); font-size: .95em; }
.summary .sep { color: var(--rule-strong); margin: 0 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.card { background: var(--plate); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.card-h h2 { font: 600 var(--t-md)/1.2 var(--font-display); letter-spacing: .04em; text-transform: uppercase; margin-right: auto; }
.card-sub { font-size: var(--t-xs); color: var(--ink-3); }
.card-b { padding: 14px 16px; }
.hint { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.45; }
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; font-size: var(--t-sm); }
.tbl th { text-align: left; font: 600 var(--t-xs)/1.2 var(--font-body); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; padding: 9px 10px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.tbl td.num { font-size: var(--t-sm); }
.tbl td.nw { white-space: nowrap; }
.tbl tbody tr:hover td { background: var(--plate-2); }
.sort-btn { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; display: inline-flex; gap: 4px; align-items: center; }
.sort-btn[data-active="true"] { color: var(--ink); }
.link-btn { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
.link-btn:hover { text-decoration-color: var(--ink); }

/* ---------- audit: riser */
.audit-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 18px; align-items: start; }
.riser-body { position: relative; padding: 8px 16px 16px; overflow: hidden; }
.storey { position: relative; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 0 18px; min-height: 96px; border-bottom: 3px solid var(--rule-strong); padding-block: 12px; }
.storey:last-of-type { border-bottom: 0; }
.storey-tag { display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; font-size: var(--t-xs); color: var(--ink-3); }
.storey-tag b { font: 600 var(--t-md)/1 var(--font-display); color: var(--ink); letter-spacing: .03em; }
.storey-run { position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; padding-left: 20px; }
.storey-run::before { /* the vertical riser, drawn through every storey */
  content: ""; position: absolute; left: 3px; top: -15px; bottom: -15px; width: 5px; border-radius: 1px;
  background: linear-gradient(90deg, var(--copper-lo), var(--copper-hi) 45%, var(--copper));
}
.storey:first-of-type .storey-run::before { top: 18px; }
.rcard {
  position: relative; display: grid; grid-template-columns: auto auto; grid-template-areas: "plate mini" "imb mini" "chip chip";
  align-items: end; gap: 6px 12px; padding: 9px 10px 9px; min-width: 132px;
  background: var(--plate); border: 1px solid var(--rule-strong); border-radius: 4px; cursor: pointer; text-align: left;
  box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s;
}
.rcard::before { /* feeder tap from the riser */
  content: ""; position: absolute; left: -11px; bottom: 22px; width: 10px; height: 2px; background: var(--copper);
}
.rcard:first-child::before { left: -17px; width: 16px; }
.rcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.rcard .plate { grid-area: plate; justify-self: start; font-size: 12px; }
.rcard .mini { grid-area: mini; height: 46px; width: 30px; align-self: end; }
.rcard-imb { grid-area: imb; font: 600 var(--t-lg)/1 var(--font-data); font-variant-numeric: tabular-nums; }
.rcard .chip { grid-area: chip; justify-self: start; }
.rcard .stale { position: absolute; top: -8px; right: -6px; font: 600 10px/1 var(--font-body); background: var(--warn); color: var(--plate); padding: 3px 5px; border-radius: 3px; }
.rcard .cover {
  position: absolute; inset: -1px; display: grid; place-items: center; border-radius: 4px;
  background: var(--plate-2); color: var(--ink-3); font: 500 var(--t-xs) var(--font-data); border: 1px dashed var(--rule-strong);
  animation: uncover .35s ease-out var(--d, 0ms) both;
}
@keyframes uncover { to { opacity: 0; visibility: hidden; } }
.scanline { position: absolute; left: 0; right: 0; height: 2px; bottom: 0; opacity: 0; pointer-events: none;
  background: var(--fix); box-shadow: 0 0 0 6px color-mix(in srgb, var(--fix) 18%, transparent), 0 0 24px 4px color-mix(in srgb, var(--fix) 35%, transparent); }
.riser.scanning .scanline { animation: scan 2.5s cubic-bezier(.45, 0, .55, 1) both; }
@keyframes scan { 0% { bottom: 0; opacity: 1; } 92% { opacity: 1; } 100% { bottom: 100%; opacity: 0; } }
.mdb { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 10px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--plate-2); font-size: var(--t-xs); color: var(--ink-2); position: relative; }
.mdb::before { content: ""; position: absolute; left: -17px; bottom: 50%; width: 16px; height: 2px; background: var(--copper); }

/* ---------- audit: dumbbell */
.db-rows { display: flex; flex-direction: column; gap: 3px; padding: 10px 16px 14px; }
.db-row { display: grid; grid-template-columns: 54px minmax(0, 1fr) 92px; align-items: center; gap: 10px; min-height: 26px; }
.db-name { font: 600 var(--t-sm)/1 var(--font-display); letter-spacing: .04em; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--ink); }
.db-track { position: relative; height: 22px; }
.db-track .zone { position: absolute; top: 3px; bottom: 3px; left: 0; background: var(--fix-soft); border-radius: 2px; }
.db-track .tline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px dashed var(--fix); }
.db-track .axis { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--rule); }
.db-track .link { position: absolute; top: calc(50% - 1.5px); height: 3px; background: var(--fix); opacity: .55; border-radius: 2px; }
.db-track .dot { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; }
.db-track .dot.before { border: 2.5px solid var(--ink-2); background: var(--plate); }
.db-track .dot.before.over { border-color: var(--alarm); }
.db-track .dot.after { background: var(--fix); box-shadow: 0 0 0 2px var(--plate); }
.db-track .dot.after.miss { background: var(--warn); }
.db-val { font: 500 var(--t-xs) var(--font-data); color: var(--ink-2); text-align: right; white-space: nowrap; }
.db-axis { display: grid; grid-template-columns: 54px minmax(0, 1fr) 92px; gap: 10px; padding: 0 16px; }
.db-axis .ticks { position: relative; height: 16px; font: 500 10px/1 var(--font-data); color: var(--ink-3); }
.db-axis .ticks span { position: absolute; transform: translateX(-50%); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--t-xs); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }

/* ---------- workspace */
.ws-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.ws-id { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.ws-spec { font: 500 var(--t-sm)/1.4 var(--font-data); color: var(--ink-2); }
.ws-note { font-size: var(--t-sm); color: var(--copper); font-weight: 500; margin-top: 2px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 12px 16px; }
.ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl-label { font: 600 var(--t-xs)/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.ctl output { font: 600 var(--t-md)/1 var(--font-data); min-width: 3.2ch; }
.ctl-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.ws-grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(320px, 1fr); gap: 18px; align-items: start; }
.ws-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

/* panelboard */
.board-wrap { padding: 14px 16px 16px; overflow-x: auto; }
.board-frame { min-width: 520px; background: var(--chassis); border: 1px solid var(--rule-strong); border-radius: 10px; padding: 10px 12px 12px; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.board-headrow { display: grid; grid-template-columns: minmax(0, 1fr) var(--bus) minmax(0, 1fr); align-items: end; margin-bottom: 6px; font: 600 10.5px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.board-headrow > span:last-child { text-align: right; }
.bus-labels { position: relative; height: 20px; }
.bus-labels b { position: absolute; top: 0; width: 20px; height: 20px; margin-left: -10px; display: grid; place-items: center; border-radius: 3px; color: #fff; background: var(--ph); font: 700 11px/1 var(--font-data); letter-spacing: 0; }
.bus-labels b.ph-A { left: 30%; } .bus-labels b.ph-B { left: 50%; } .bus-labels b.ph-C { left: 70%; }
.board { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) var(--bus) minmax(0, 1fr); grid-auto-rows: var(--row); row-gap: 4px; }
.bus { grid-column: 2; grid-row: 1 / -1; width: 100%; height: 100%; display: block; overflow: visible; }
.bus .bar { fill: url(#copper); }
.bus .tap { stroke-width: 3; vector-effect: non-scaling-stroke; }
.bus .tap.faint { opacity: .28; }
.bus .stud { fill: var(--ph); }
.bus .tap.A, .bus .stud.A { stroke: var(--phase-a); fill: var(--phase-a); }
.bus .tap.B, .bus .stud.B { stroke: var(--phase-b); fill: var(--phase-b); }
.bus .tap.C, .bus .stud.C { stroke: var(--phase-c); fill: var(--phase-c); }
.brk {
  position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; min-width: 0;
  background: var(--plate); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 0 0 8px;
  cursor: pointer; box-shadow: 0 1px 0 rgba(0,0,0,.08); transition: box-shadow .15s, border-color .15s;
}
.brk.R { flex-direction: row-reverse; padding: 0 8px 0 0; text-align: right; }
.brk:hover { border-color: var(--ink-2); }
.brk-no { font: 600 var(--t-md)/1 var(--font-data); min-width: 2ch; text-align: center; color: var(--ink); }
.brk-body { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.2; gap: 2px; }
.brk-name { font-size: 12px; font-weight: 500; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.brk-meta { font: 400 10.5px/1.2 var(--font-data); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em; }
.brk-va { display: flex; flex-direction: column; align-items: flex-end; flex: none; line-height: 1.05; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.brk.R .brk-va { align-items: flex-start; }
.brk-va b { font-size: 13px; font-weight: 600; }
.brk-va small { font-size: 9.5px; color: var(--ink-3); letter-spacing: .06em; }
.brk.zero .brk-va b { color: var(--warn); }
.brk-handle { align-self: stretch; display: flex; flex-direction: column; gap: 4px; width: 16px; padding: 5px 0; flex: none; }
.brk-handle i { flex: 1; background: var(--ph); border-radius: 2px; }
.brk.L .brk-handle { border-left: 1px solid var(--rule); padding-left: 0; margin-left: auto; width: 14px; border-radius: 0 3px 3px 0; overflow: hidden; }
.brk.R .brk-handle { border-right: 1px solid var(--rule); width: 14px; border-radius: 3px 0 0 3px; overflow: hidden; }
.brk-handle { position: relative; }
.brk.multi .brk-handle::after { /* handle tie bar on multi-pole breakers */
  content: ""; position: absolute; left: 50%; top: 10px; bottom: 10px; width: 3px; margin-left: -1.5px; background: var(--ink); opacity: .55; border-radius: 2px;
}
.brk-lock { display: grid; place-items: center; width: 26px; height: 26px; flex: none; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--ink-3); cursor: pointer; opacity: .55; }
.brk:hover .brk-lock, .brk-lock.on, .brk-lock:focus-visible { opacity: 1; }
.brk-lock:hover { border-color: var(--rule-strong); background: var(--plate-2); }
.brk-lock.on { color: var(--lock); background: var(--lock-soft); }
.brk-lock .i { width: 14px; height: 14px; }
.brk.locked { background-image: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--lock) 9%, transparent) 7px 8px); }
.brk.spare { background: var(--plate-2); border-style: dashed; }
.brk.spare .brk-name { color: var(--ink-2); font-style: italic; }
.brk.zero .brk-meta { color: var(--warn); }
.brk.sel { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.brk.pending { border: 1.5px dashed var(--fix); }
.brk.moved { border: 2px solid var(--fix); box-shadow: 0 0 0 4px var(--fix-soft); }
.brk.flying { z-index: 5; box-shadow: var(--shadow-lift), 0 0 0 4px var(--fix-soft); }
.was, .pend { font: 600 10px/1 var(--font-data); padding: 3px 5px; border-radius: 2px; white-space: nowrap; }
.was { color: var(--on-fix); background: var(--fix); }
.pend { color: var(--fix-ink); background: var(--plate); border: 1px dashed var(--fix); }
.brk .was, .brk .pend { position: absolute; top: -9px; z-index: 2; }
.brk.L .was, .brk.L .pend { right: 44px; }
.brk.R .was, .brk.R .pend { left: 44px; }
.sched .was, .sched .pend { display: inline-block; margin-left: 4px; }
.brk.eval { animation: evalpulse 1.1s ease-in-out var(--d, 0ms) 2; }
@keyframes evalpulse { 0%, 100% { box-shadow: 0 1px 0 rgba(0,0,0,.08); } 50% { box-shadow: 0 0 0 3px var(--fix-soft), 0 0 0 4px var(--fix); } }
.space {
  position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 0 10px; border: 1px dashed color-mix(in srgb, var(--ink-3) 55%, transparent); border-radius: 4px;
  font: 500 10.5px/1 var(--font-data); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em;
}
.space.R { flex-direction: row-reverse; }
.space.ghost { border: 1.5px dashed var(--fix); color: var(--fix-ink); background: color-mix(in srgb, var(--fix) 7%, transparent); text-transform: none; letter-spacing: 0; }
.board-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0 16px 14px; font-size: var(--t-xs); color: var(--ink-2); }
.board-legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-box { width: 18px; height: 12px; border-radius: 2px; display: inline-block; border: 1px solid var(--rule-strong); background: var(--plate); }
.lg-box.moved { border: 2px solid var(--fix); }
.lg-box.pending { border: 1.5px dashed var(--fix); }
.lg-box.space { border: 1px dashed var(--ink-3); background: transparent; }
.lg-box.locked { background-image: repeating-linear-gradient(135deg, transparent 0 3px, var(--lock) 3px 4px); }

/* schedule */
.sched { width: 100%; min-width: 640px; font-size: var(--t-sm); }
.sched th { font: 600 10.5px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 7px 6px; border-bottom: 1.5px solid var(--ink); text-align: left; white-space: nowrap; }
.sched td { padding: 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.sched .ckt { font: 600 var(--t-sm) var(--font-data); width: 3ch; text-align: center; }
.sched .desc { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
.sched .pc { font: 500 11.5px var(--font-data); text-align: center; width: 80px; color: var(--ink-3); }
.sched .pc.live { color: var(--ink); background: var(--ph-soft); font-weight: 600; }
.sched th.pc { text-align: center; color: var(--ink); }
.sched .va { font: 500 var(--t-sm) var(--font-data); text-align: right; }
.sched tr.moved td.side-moved { background: var(--fix-soft); }
.sched tfoot td { font: 600 var(--t-sm) var(--font-data); border-top: 1.5px solid var(--ink); border-bottom: 0; }
.sched .muted { color: var(--ink-3); }

/* readout */
.readout { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.readout-top { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.k { display: block; font: 600 var(--t-xs)/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.imb-big { font: 600 var(--t-3xl)/.9 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.imb-before { font: 600 var(--t-xl)/1 var(--font-display); color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 2px; }
.imb-arrow { color: var(--ink-3); font-size: var(--t-lg); padding-bottom: 6px; }
.gauge { position: relative; height: 12px; background: var(--plate-2); border-radius: 6px; border: 1px solid var(--rule); }
.gauge .g-ok { position: absolute; left: 0; top: 0; bottom: 0; background: var(--fix-soft); border-right: 2px solid var(--fix); border-radius: 6px 0 0 6px; }
.gauge .g-mark { position: absolute; top: -5px; width: 3px; height: 20px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); }
.gauge .g-mark.before { background: var(--alarm); opacity: .9; }
.gauge .g-mark.after { background: var(--fix); }
.gauge-scale { position: relative; height: 12px; font: 500 10px/1 var(--font-data); color: var(--ink-3); }
.gauge-scale span { position: absolute; transform: translateX(-50%); }
.readout-note { font-size: var(--t-xs); color: var(--ink-2); }

/* phase loading */
.pl { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.pl-row { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: center; }
.pl-tag { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 3px; background: var(--ph); color: #fff; font: 700 12px/1 var(--font-data); }
.pl-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pl-track { position: relative; height: 18px; }
.pl-band { position: absolute; top: -3px; bottom: -3px; background: var(--fix-soft); border-left: 1px solid var(--fix); border-right: 1px solid var(--fix); }
.pl-avg { position: absolute; top: -5px; bottom: -5px; width: 0; border-left: 1.5px dashed var(--ink-2); }
.pl-before { position: absolute; left: 0; top: 2px; height: 14px; border: 1.5px dashed var(--ph); border-radius: 2px; background: transparent; }
.pl-bar { position: absolute; left: 0; top: 2px; height: 14px; background: var(--ph); border-radius: 2px; transition: width .9s cubic-bezier(.3, 0, .2, 1); }
.pl-vals { display: flex; justify-content: space-between; gap: 8px; font: 500 11.5px/1.2 var(--font-data); color: var(--ink-2); flex-wrap: wrap; }
.pl-vals b { color: var(--ink); font-weight: 600; }
.pl-foot { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--t-xs); color: var(--ink-2); padding-top: 2px; }
.pl-foot span { display: inline-flex; align-items: center; gap: 6px; }

/* phasor */
.phasor-wrap { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 14px; padding: 12px 16px 16px; align-items: center; }
.phasor { width: 180px; height: 180px; overflow: visible; }
.phasor .ring { fill: none; stroke: var(--rule); stroke-width: 1; }
.phasor .axis { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 2 3; }
.phasor .vec { stroke-width: 3.5; stroke-linecap: round; }
.phasor .vec.A { stroke: var(--phase-a); } .phasor .vec.B { stroke: var(--phase-b); } .phasor .vec.C { stroke: var(--phase-c); }
.phasor .vec.N { stroke: var(--ink); stroke-width: 4.5; }
.phasor .head.A { fill: var(--phase-a); } .phasor .head.B { fill: var(--phase-b); } .phasor .head.C { fill: var(--phase-c); } .phasor .head.N { fill: var(--ink); }
.phasor text { font: 600 11px var(--font-data); fill: var(--ink-2); }
.neutral-big { font: 600 var(--t-xl)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.phasor-copy { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

/* inspector */
.insp { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.insp-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: center; font-size: var(--t-sm); }
.insp-grid dt { color: var(--ink-3); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.insp-grid dd { margin: 0; }
.insp-grid input[type="number"] { width: 110px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: var(--t-sm); }
.sheet-tag { white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; font: 500 11px/1 var(--font-data); padding: 3px 6px; border-radius: 3px; border: 1px solid var(--rule-strong); margin: 0 4px 4px 0; }
.sheet-tag.issued { border-color: var(--warn); color: var(--warn); }

/* review dialog and trace */
.review-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.dialog { overflow: hidden; }
.dialog-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 12px 16px; background: var(--ink); color: var(--plate); }
.dialog-h h2 { font: 600 var(--t-md)/1.2 var(--font-display); letter-spacing: .04em; text-transform: uppercase; margin-right: auto; }
.dialog-h .txn { font: 500 var(--t-xs) var(--font-data); opacity: .75; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 11px 16px; font-size: var(--t-sm); border-bottom: 1px solid var(--rule); }
.banner .i { margin-top: 2px; }
.banner-needs { background: var(--warn-soft); color: var(--warn); }
.banner-locked { background: var(--lock-soft); color: var(--lock); }
.banner-ok { background: var(--fix-soft); color: var(--fix-ink); }
.banner-warn { background: var(--warn-soft); color: var(--warn); }
.banner p { color: var(--ink); }
.chg td { font-size: var(--t-sm); }
.chg td.cname { min-width: 170px; }
.chg td.num { white-space: nowrap; }
.chg .ckt { font: 600 var(--t-md) var(--font-data); }
.chg .slot { font: 500 var(--t-sm) var(--font-data); white-space: nowrap; }
.chg .slot i { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 3px; background: var(--ph); color: #fff; font: 700 10.5px/1 var(--font-data); margin-left: 4px; }
.chg .newno { font: 600 var(--t-md) var(--font-data); color: var(--fix-ink); }
.chg .kind { font: 600 10px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); display: block; margin-top: 3px; }
.dialog-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-top: 1px solid var(--rule); background: var(--plate-2); }
.dialog-foot .metrics { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 var(--t-xs) var(--font-data); color: var(--ink-2); margin-right: auto; }
.dialog-foot .metrics b { color: var(--ink); }
.empty-state { padding: 22px 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; color: var(--ink-2); font-size: var(--t-sm); }
.trace ol { list-style: none; margin: 0; padding: 12px 16px 4px; display: flex; flex-direction: column; gap: 10px; counter-reset: it; }
.trace li { position: relative; padding-left: 26px; font-size: var(--t-sm); line-height: 1.45; }
.trace li::before { counter-increment: it; content: counter(it); position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--plate); font: 600 10px/1 var(--font-data); }
.trace li.stop::before { content: "■"; background: var(--fix); color: var(--on-fix); font-size: 8px; }
.trace li.reveal { animation: rise .45s ease-out var(--d, 0ms) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.trace .muted { color: var(--ink-3); font-size: var(--t-xs); }
.explain { margin: 6px 16px 16px; padding: 12px 14px; border-left: 3px solid var(--copper); background: var(--plate-2); border-radius: 0 6px 6px 0; display: flex; flex-direction: column; gap: 6px; }
.explain p { font-size: var(--t-sm); line-height: 1.55; }
.explain .hint { font-style: italic; }

/* compare */
.cmp-pitch { display: block; font: 600 var(--t-xl)/1.15 var(--font-display); max-width: 60ch; }
.cmp-pitch em { font-style: normal; color: var(--fix-ink); }
.cmp-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
.cmp-col .card-h h2 { font-size: var(--t-md); }
.cmp-col.best { border-color: var(--fix); box-shadow: 0 0 0 1px var(--fix), var(--shadow); }
.cmp-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border-bottom: 1px solid var(--rule); }
.cmp-stats > div { background: var(--plate); padding: 12px 14px; }
.cmp-stats .v { font: 600 var(--t-2xl)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.cmp-stats .v.small { font-size: var(--t-xl); }
.slotmap { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 4px; padding: 14px; }
.sm { position: relative; display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px; border-radius: 3px; font: 500 10.5px/1 var(--font-data); background: var(--plate-2); color: var(--ink-3); border: 1px solid transparent; overflow: hidden; white-space: nowrap; }
.sm.load { background: var(--ph-soft); color: var(--ink); border-color: color-mix(in srgb, var(--ph) 40%, transparent); }
.sm.load::before { content: ""; width: 4px; align-self: stretch; margin: 3px 0; border-radius: 1px; background: var(--ph); }
.sm.moved { border: 2px solid var(--fix); box-shadow: 0 0 0 2px var(--fix-soft); }
.sm b { font-weight: 600; }
.sm .va { margin-left: auto; }
.sm.locked { background-image: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--lock) 18%, transparent) 5px 6px); }

<script>
/* src/phase_balancer.js */
/*
 * Phase balancer core.
 * Line-for-line JavaScript port of reference/phase_balancer.py (concept document §10).
 * No DOM, no dependencies: runs in the browser (window.PhaseBalancer) and in Node (require).
 *
 * The only addition to the Python is an optional `trace` array on minMoveBalance, which
 * records each search iteration so the UI can explain what the optimiser did.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.PhaseBalancer = api;
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  const PHASES = ["A", "B", "C"];

  // Circuit: { number, load_va, phases: ["A"] | ["A","B"] | ["A","B","C"], locked }
  function Circuit(number, load_va, phases, locked = false) {
    return { number, load_va, phases: phases.slice(), locked: !!locked };
  }

  function isMovable(c) {
    return c.phases.length === 1 && !c.locked;
  }

  function replacePhases(c, phases) {
    return Object.assign({}, c, { phases: phases.slice() });
  }

  function samePhases(a, b) {
    return a.length === b.length && a.every((p, i) => p === b[i]);
  }

  function phaseLoads(circuits) {
    const loads = { A: 0.0, B: 0.0, C: 0.0 };
    for (const c of circuits) {
      const share = c.load_va / c.phases.length; // multi-pole load splits equally
      for (const p of c.phases) loads[p] += share;
    }
    return loads;
  }

  function imbalancePct(loads) {
    const avg = (0 + loads.A + loads.B + loads.C) / 3;
    if (avg === 0) return 0.0;
    return Math.max(Math.abs(loads.A - avg), Math.abs(loads.B - avg), Math.abs(loads.C - avg)) / avg * 100;
  }

  /* Greedy Longest-Processing-Time: biggest movable load to lightest phase.
     Ignores current positions, so it usually moves many circuits. */
  function lptBalance(circuits) {
    const fixed = circuits.filter((c) => !isMovable(c));
    const movable = circuits.filter(isMovable).sort((a, b) => b.load_va - a.load_va); // stable, like sorted()
    const loads = phaseLoads(fixed);
    const result = fixed.slice();
    for (const c of movable) {
      let p = PHASES[0];
      for (const q of PHASES) if (loads[q] < loads[p]) p = q; // min() keeps the first minimum
      loads[p] += c.load_va;
      result.push(replacePhases(c, [p]));
    }
    return result.sort((a, b) => a.number - b.number);
  }

  /* Local search starting from the drawn layout. Each step applies the single
     move or pairwise swap that cuts imbalance the most per circuit renumbered,
     and stops once the target is met or nothing improves.
     Returns [circuits, movedSet] like the Python tuple. */
  function minMoveBalance(circuits, opts) {
    const o = opts || {};
    const target_pct = o.target_pct == null ? 5.0 : o.target_pct;
    const slot_capacity = o.slot_capacity || null;
    const max_iter = o.max_iter == null ? 50 : o.max_iter;
    const trace = o.trace || null;

    let cur = new Map(circuits.map((c) => [c.number, c])); // Map keeps insertion order, like dict
    const moved = new Set();

    const countOn = (phase, state) => {
      let n = 0;
      for (const c of state.values()) if (isMovable(c) && c.phases[0] === phase) n++;
      return n;
    };

    let stopReason = "iteration limit";
    for (let iter = 1; iter <= max_iter; iter++) {
      const loads = phaseLoads(cur.values());
      const base = imbalancePct(loads);
      if (base <= target_pct) { stopReason = "target met"; break; }
      let best = null; // { gain, state, touched, step }
      const movables = [...cur.values()].filter(isMovable);
      let evaluatedMoves = 0, evaluatedSwaps = 0, blockedByCapacity = 0;
      // single moves
      for (const c of movables) {
        for (const p of PHASES) {
          if (p === c.phases[0]) continue;
          if (slot_capacity && countOn(p, cur) >= slot_capacity[p]) { blockedByCapacity++; continue; }
          const trial = new Map(cur);
          trial.set(c.number, replacePhases(c, [p]));
          evaluatedMoves++;
          const after = imbalancePct(phaseLoads(trial.values()));
          const gain = base - after;
          if (gain > 1e-9 && (best === null || gain > best.gain)) {
            best = { gain, state: trial, touched: [c.number],
              step: { kind: "move", numbers: [c.number], from: [c.phases[0]], to: [p], after } };
          }
        }
      }
      // swaps (keep slot counts unchanged)
      for (let i = 0; i < movables.length; i++) {
        for (let j = i + 1; j < movables.length; j++) {
          const a = movables[i], b = movables[j];
          if (samePhases(a.phases, b.phases)) continue;
          const trial = new Map(cur);
          trial.set(a.number, replacePhases(a, b.phases));
          trial.set(b.number, replacePhases(b, a.phases));
          evaluatedSwaps++;
          const after = imbalancePct(phaseLoads(trial.values()));
          const gain = (base - after) / 2;
          if (gain > 1e-9 && (best === null || gain > best.gain)) {
            best = { gain, state: trial, touched: [a.number, b.number],
              step: { kind: "swap", numbers: [a.number, b.number], from: [a.phases[0], b.phases[0]], to: [b.phases[0], a.phases[0]], after } };
          }
        }
      }
      if (best === null) {
        stopReason = "no improving move";
        if (trace) trace.push({ iter, before: base, evaluatedMoves, evaluatedSwaps, blockedByCapacity, step: null });
        break;
      }
      if (trace) trace.push({ iter, before: base, evaluatedMoves, evaluatedSwaps, blockedByCapacity, gainPerCircuit: best.gain, step: best.step });
      cur = best.state;
      for (const n of best.touched) moved.add(n);
    }
    if (stopReason === "iteration limit" && imbalancePct(phaseLoads(cur.values())) <= target_pct) stopReason = "target met";
    if (trace) trace.stopReason = stopReason;

    const original = new Map(circuits.map((c) => [c.number, c.phases]));
    const finalMoved = new Set([...moved].filter((n) => !samePhases(cur.get(n).phases, original.get(n))));
    return [[...cur.values()].sort((a, b) => a.number - b.number), finalMoved];
  }

  return { PHASES, Circuit, isMovable, phaseLoads, imbalancePct, lptBalance, minMoveBalance };
});

<script>
/* src/panel_model.js */
/*
 * Panel model: the "Revit layer" of the concept (§11), simulated.
 * Translates a panelboard (slots, poles, locks, spares) into core circuits, runs the core,
 * and maps the core's phase decisions back onto concrete slots (§11.4).
 */
(function (root, factory) {
  const PB = typeof module === "object" && module.exports ? require("./phase_balancer.js") : root.PhaseBalancer;
  const api = factory(PB);
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.PanelModel = api;
})(typeof self !== "undefined" ? self : this, function (PB) {
  "use strict";
  const PHASES = PB.PHASES;

  const DEFAULT_CONFIG = {
    target: 10,                 // imbalance_target_pct
    basis: "connected",         // balance_basis: connected | demand
    approach: "min_move",       // default_approach: min_move | lpt
    maxMoves: 6,                // max_moves_per_panel
    respectLocks: true,         // respect_locked_slots
    doNotMoveParam: "DoNotMove",
    voltage: "400/230",
    engineer: "Pilot engineer",
    demandFactors: { LTG: 1.0, REC: 0.8, EQP: 0.75, MECH: 1.0 },
  };

  const VOLTAGES = {
    "400/230": { ll: 400, ln: 230, label: "400/230 V 3Φ 4W" },
    "415/240": { ll: 415, ln: 240, label: "415/240 V 3Φ 4W" },
    "208/120": { ll: 208, ln: 120, label: "208Y/120 V 3Φ 4W" },
    "480/277": { ll: 480, ln: 277, label: "480Y/277 V 3Φ 4W" },
  };

  // §1.1: rows feed A, B, C in sequence; odd slots left, even slots right.
  function phaseOfSlot(slot) {
    return PHASES[(Math.ceil(slot / 2) - 1) % 3];
  }
  function rowOfSlot(slot) {
    return Math.ceil(slot / 2);
  }
  // A multi-pole breaker occupies consecutive rows in the same column: s, s+2, s+4.
  function slotsOf(c) {
    const s = [];
    for (let k = 0; k < c.poles; k++) s.push(c.slot + 2 * k);
    return s;
  }
  function phasesOf(c) {
    return slotsOf(c).map(phaseOfSlot);
  }

  function isLocked(c, cfg) {
    return !!c.doNotMove || (!!c.lockedSlot && cfg.respectLocks !== false);
  }
  function basisVA(c, cfg) {
    if (c.spare) return 0;
    if (cfg.basis === "demand") {
      const f = cfg.demandFactors && cfg.demandFactors[c.cls];
      return c.va * (f == null ? 1 : f);
    }
    return c.va;
  }
  function loadCircuits(panel) {
    return panel.circuits.filter((c) => !c.spare);
  }

  function toCore(panel, cfg, opts) {
    const ignoreLocks = opts && opts.ignoreLocks;
    return loadCircuits(panel)
      .slice()
      .sort((a, b) => a.slot - b.slot)
      .map((c) => PB.Circuit(c.slot, basisVA(c, cfg), phasesOf(c), ignoreLocks ? false : isLocked(c, cfg)));
  }

  // slot -> circuit, for every slot a circuit (or spare) occupies
  function occupancy(panel) {
    const occ = new Map();
    for (const c of panel.circuits) for (const s of slotsOf(c)) occ.set(s, c);
    return occ;
  }

  // R7: spaces (empty) and spares are valid move targets.
  function freeSlotsByPhase(panel) {
    const occ = occupancy(panel);
    const free = { A: [], B: [], C: [] };
    for (let s = 1; s <= panel.ways; s++) {
      const c = occ.get(s);
      if (!c || c.spare) free[phaseOfSlot(s)].push(s);
    }
    return free;
  }

  // R4: 1-pole circuits on a phase cannot exceed the slots that phase can offer them.
  function slotCapacity(panel, cfg, opts) {
    const free = freeSlotsByPhase(panel);
    const cap = { A: free.A.length, B: free.B.length, C: free.C.length };
    for (const c of toCore(panel, cfg, opts)) if (PB.isMovable(c)) cap[c.phases[0]]++;
    return cap;
  }

  function onePoleLoads(panel, cfg) {
    const L = { A: 0, B: 0, C: 0 };
    for (const c of loadCircuits(panel)) if (c.poles === 1) L[phaseOfSlot(c.slot)] += basisVA(c, cfg);
    return L;
  }

  // Neutral current from 1-pole (L-N) loads at unity power factor. 2- and 3-pole loads add no neutral current.
  function neutralCurrent(L1p, vln) {
    const a = L1p.A / vln, b = L1p.B / vln, c = L1p.C / vln;
    return Math.sqrt(Math.max(0, a * a + b * b + c * c - a * b - b * c - c * a));
  }

  function audit(panel, cfg) {
    const core = toCore(panel, cfg);
    const loads = PB.phaseLoads(core);
    const imb = PB.imbalancePct(loads);
    const movable = core.filter(PB.isMovable).length;
    const lockedCount = loadCircuits(panel).filter((c) => isLocked(c, cfg)).length;
    const zeroLoad = loadCircuits(panel).filter((c) => !(c.va > 0));
    let status = imb <= cfg.target ? "ok" : movable === 0 ? "locked" : "over";
    return { loads, imb, status, movable, lockedCount, zeroLoad, total: loads.A + loads.B + loads.C };
  }

  /* Map the core's phase decisions onto concrete slots (§11.4).
     1. A circuit going p→q and another going q→p exchange slots directly (a swap).
     2. Every other moved circuit takes the lowest-numbered free slot on its new phase.
     3. A spare displaced from its slot takes over a slot vacated by a moved circuit. */
  function mapToSlots(panel, newPhase /* Map oldSlot -> phase, for moved circuits only */) {
    const bySlot = new Map(panel.circuits.map((c) => [c.slot, c]));
    const moved = [...newPhase.keys()].sort((a, b) => a - b).map((s) => bySlot.get(s));
    const target = new Map(); // oldSlot -> newSlot
    const partner = new Map();
    const unpaired = [];
    // 1. pair direct swaps
    for (const x of moved) {
      if (target.has(x.slot)) continue;
      const from = phaseOfSlot(x.slot), to = newPhase.get(x.slot);
      const y = moved.find((m) => m !== x && !target.has(m.slot) && phaseOfSlot(m.slot) === to && newPhase.get(m.slot) === from);
      if (y) {
        target.set(x.slot, y.slot); target.set(y.slot, x.slot);
        partner.set(x.slot, y.slot); partner.set(y.slot, x.slot);
      }
    }
    for (const x of moved) if (!target.has(x.slot)) unpaired.push(x);
    // 2. pool = free slots (spaces + spares) + slots vacated by unpaired movers
    const free = freeSlotsByPhase(panel);
    const pool = { A: free.A.slice(), B: free.B.slice(), C: free.C.slice() };
    for (const x of unpaired) pool[phaseOfSlot(x.slot)].push(x.slot);
    for (const p of PHASES) pool[p].sort((a, b) => a - b);
    const used = new Set();
    const errors = [];
    for (const x of unpaired) {
      const to = newPhase.get(x.slot);
      const s = pool[to].find((k) => !used.has(k) && k !== x.slot);
      if (s == null) { errors.push(`No free slot on phase ${to} for circuit ${x.slot}`); continue; }
      used.add(s);
      target.set(x.slot, s);
    }
    // 3. displaced spares move into vacated slots that nobody reused
    const occ = occupancy(panel);
    const vacated = unpaired.map((x) => x.slot).filter((s) => !used.has(s)).sort((a, b) => a - b);
    const spareMoves = [];
    for (const s of [...used].sort((a, b) => a - b)) {
      const o = occ.get(s);
      if (o && o.spare) {
        const dest = vacated.shift();
        if (dest == null) { errors.push(`No slot left for displaced spare ${s}`); continue; }
        spareMoves.push({ fromSlot: s, toSlot: dest });
        target.set(s, dest);
      }
    }
    const changes = moved.filter((x) => target.has(x.slot)).map((x) => ({
      id: x.id, name: x.name, va: x.va, cls: x.cls, sheets: x.sheets || [],
      fromSlot: x.slot, toSlot: target.get(x.slot),
      fromPhase: phaseOfSlot(x.slot), toPhase: phaseOfSlot(target.get(x.slot)),
      kind: partner.has(x.slot) ? "swap" : "move",
      partnerSlot: partner.get(x.slot) || null,
    }));
    const circuits = panel.circuits.map((c) => (target.has(c.slot) ? Object.assign({}, c, { slot: target.get(c.slot) }) : Object.assign({}, c)));
    return { changes, spareMoves, circuits, errors };
  }

  function bestEffortReason(panel, cfg, afterImb) {
    // Would the target be reachable if locks were ignored? Then locks are the limiting factor.
    const unlocked = toCore(panel, cfg, { ignoreLocks: true });
    const [res] = PB.minMoveBalance(unlocked, { target_pct: cfg.target, slot_capacity: slotCapacity(panel, cfg, { ignoreLocks: true }) });
    const unlockedImb = PB.imbalancePct(PB.phaseLoads(res));
    const hasLocks = loadCircuits(panel).some((c) => isLocked(c, cfg));
    if (hasLocks && unlockedImb <= cfg.target) {
      return { status: "locked", reason: `Locked circuits block the fix. Without locks the panel could reach ${unlockedImb.toFixed(1)}%.` };
    }
    const biggest = loadCircuits(panel).filter((c) => c.poles === 1).sort((a, b) => b.va - a.va)[0];
    if (biggest) {
      const others = loadCircuits(panel).reduce((s, c) => s + basisVA(c, cfg), 0) - basisVA(biggest, cfg);
      if (basisVA(biggest, cfg) > others / 2) {
        return { status: "needs", reason: `Circuit ${biggest.slot} (${Math.round(biggest.va).toLocaleString("en-GB")} VA) outweighs what the other two phases can offset. Best achievable is ${afterImb.toFixed(1)}%.` };
      }
    }
    return { status: "needs", reason: `No further move or swap improves balance. Best achievable is ${afterImb.toFixed(1)}%.` };
  }

  function propose(panel, cfg, approach) {
    const appr = approach || cfg.approach;
    const core = toCore(panel, cfg);
    const before = PB.phaseLoads(core);
    const beforeImb = PB.imbalancePct(before);
    const cap = slotCapacity(panel, cfg);
    const trace = [];
    let result, movedSet;
    if (appr === "lpt") {
      result = PB.lptBalance(core);
      const orig = new Map(core.map((c) => [c.number, c.phases.join("")]));
      movedSet = new Set(result.filter((c) => c.phases.join("") !== orig.get(c.number)).map((c) => c.number));
      trace.stopReason = "LPT assigns every movable circuit from scratch";
    } else {
      [result, movedSet] = PB.minMoveBalance(core, { target_pct: cfg.target, slot_capacity: cap, trace });
    }
    const after = PB.phaseLoads(result);
    const afterImb = PB.imbalancePct(after);
    const newPhase = new Map();
    for (const c of result) if (movedSet.has(c.number)) newPhase.set(c.number, c.phases[0]);
    const mapped = mapToSlots(panel, newPhase);

    // §11.4 read-back: recompute loads from the mapped slot layout and compare with the core's prediction.
    const readBack = PB.phaseLoads(toCore({ ways: panel.ways, circuits: mapped.circuits }, cfg));
    const readBackOk = PHASES.every((p) => Math.abs(readBack[p] - after[p]) <= 1) && mapped.errors.length === 0;

    const reached = afterImb <= cfg.target;
    let status, reason = "";
    if (beforeImb <= cfg.target && appr !== "lpt") { status = "ok"; reason = "Already within target. No changes proposed."; }
    else if (!readBackOk) { status = "needs"; reason = mapped.errors[0] || "Slot read-back did not match the prediction, so the proposal was rolled back."; }
    else if (reached) { status = "proposed"; }
    else ({ status, reason } = bestEffortReason(panel, cfg, afterImb));

    const warnings = [];
    if (mapped.changes.length > cfg.maxMoves) warnings.push(`This proposal renumbers ${mapped.changes.length} circuits, above the firm limit of ${cfg.maxMoves} per panel.`);
    const issued = new Set();
    for (const ch of mapped.changes) for (const sh of ch.sheets) if (sh.issued) issued.add(sh.id);
    if (issued.size) warnings.push(`Moved circuits are tagged on issued sheet${issued.size > 1 ? "s" : ""} ${[...issued].join(", ")}. Cloud the revision before re-issue.`);

    return {
      approach: appr, target: cfg.target, basis: cfg.basis,
      before, beforeImb, after, afterImb, reached, status, reason, warnings,
      changes: mapped.changes, spareMoves: mapped.spareMoves, newCircuits: mapped.circuits,
      trace, readBack, readBackOk, slotCapacity: cap,
    };
  }

  return {
    DEFAULT_CONFIG, VOLTAGES, phaseOfSlot, rowOfSlot, slotsOf, phasesOf, isLocked, basisVA,
    toCore, occupancy, freeSlotsByPhase, slotCapacity, onePoleLoads, neutralCurrent, audit, mapToSlots, propose,
  };
});
