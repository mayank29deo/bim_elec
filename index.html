<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phase-Balancing Copilot</title>
<meta name="description" content="Dry-run simulator for the Panel Schedule and Phase-Balancing Copilot: check every panel, find the fewest circuit moves, review and apply.">
<meta name="theme-color" content="#E1E5E0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phase Copilot">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316201C'/%3E%3Crect x='8' y='7' width='4' height='18' rx='1' fill='%23C8432B'/%3E%3Crect x='14' y='7' width='4' height='18' rx='1' fill='%23D89D14'/%3E%3Crect x='20' y='7' width='4' height='18' rx='1' fill='%232C63BE'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one clear next step at the top of each screen, detail tucked into "show more" sections.
   Desktop: panel list on the left, tabs across the top. Phone: bottom navigation, panel picker, compact board.
   Palette: switchgear enclosure grey, copper bus, R-Y-B phase colours; teal marks the copilot's fix. */
:root {
  --ground: #E1E5E0;
  --chassis: #D2D8D2;
  --plate: #F8F9F6;
  --plate-2: #EEF1EC;
  --ink: #16201C;
  --ink-2: #47534E;
  --ink-3: #6E7A74;
  --rule: #C8CFC9;
  --rule-strong: #A7B1AA;
  --phase-a: #C8432B; --phase-a-ink: #A0311C; --phase-a-soft: #F2DBD4;
  --phase-b: #D89D14; --phase-b-ink: #7E5700; --phase-b-soft: #F4E7C4;
  --phase-c: #2C63BE; --phase-c-ink: #224F99; --phase-c-soft: #D8E2F3;
  --copper: #B46B34; --copper-hi: #DA9862; --copper-lo: #8A4D20;
  --fix: #0A7C74; --fix-ink: #076259; --fix-soft: #D2E9E5; --on-fix: #FFFFFF;
  --alarm: #B3173F; --alarm-soft: #F4D8DF;
  --warn: #A55100; --warn-soft: #F4E1CB;
  --lock: #56636B; --lock-soft: #E0E5E8;
  --shadow: 0 1px 0 rgba(22, 32, 28, .05), 0 1px 3px rgba(22, 32, 28, .10);
  --shadow-lift: 0 6px 18px rgba(22, 32, 28, .18);
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --t-xs: 11.5px; --t-sm: 13px; --t-base: 14.5px; --t-md: 16px; --t-lg: 20px; --t-xl: 28px; --t-2xl: 38px; --t-3xl: 56px;
  --r: 8px;
  --row: 50px;
  --bus: 120px;
  --bnav: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0F1513; --chassis: #1C2421; --plate: #19211E; --plate-2: #212A26;
    --ink: #E3E9E5; --ink-2: #A8B3AD; --ink-3: #85918B; --rule: #2C3733; --rule-strong: #3E4C46;
    --phase-a: #E2644C; --phase-a-ink: #F28C76; --phase-a-soft: #3A1E18;
    --phase-b: #E5B23C; --phase-b-ink: #F0C868; --phase-b-soft: #392C10;
    --phase-c: #4F8BEA; --phase-c-ink: #8AB1F3; --phase-c-soft: #172A47;
    --copper: #C98149; --copper-hi: #E7A774; --copper-lo: #8E5427;
    --fix: #2DB3A6; --fix-ink: #5FD0C4; --fix-soft: #12312D; --on-fix: #06201D;
    --alarm: #EE5A7F; --alarm-soft: #3B1520; --warn: #E89A3C; --warn-soft: #3A2810; --lock: #95A3AB; --lock-soft: #263036;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 1px 3px rgba(0, 0, 0, .4);
    --shadow-lift: 0 8px 22px rgba(0, 0, 0, .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0F1513; --chassis: #1C2421; --plate: #19211E; --plate-2: #212A26;
  --ink: #E3E9E5; --ink-2: #A8B3AD; --ink-3: #85918B; --rule: #2C3733; --rule-strong: #3E4C46;
  --phase-a: #E2644C; --phase-a-ink: #F28C76; --phase-a-soft: #3A1E18;
  --phase-b: #E5B23C; --phase-b-ink: #F0C868; --phase-b-soft: #392C10;
  --phase-c: #4F8BEA; --phase-c-ink: #8AB1F3; --phase-c-soft: #172A47;
  --copper: #C98149; --copper-hi: #E7A774; --copper-lo: #8E5427;
  --fix: #2DB3A6; --fix-ink: #5FD0C4; --fix-soft: #12312D; --on-fix: #06201D;
  --alarm: #EE5A7F; --alarm-soft: #3B1520; --warn: #E89A3C; --warn-soft: #3A2810; --lock: #95A3AB; --lock-soft: #263036;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 1px 3px rgba(0, 0, 0, .4);
  --shadow-lift: 0 8px 22px rgba(0, 0, 0, .55);
}

/* ---------- base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 var(--t-base)/1.55 var(--font-body); padding-bottom: calc(var(--bnav) + env(safe-area-inset-bottom, 0px)); }
body.touring { padding-bottom: 190px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
table { border-collapse: collapse; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--fix); outline-offset: 2px; border-radius: 3px; }
.mono, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.tx-alarm { color: var(--alarm); } .tx-fix { color: var(--fix-ink); } .tx-warn { color: var(--warn); } .tx-muted { color: var(--ink-3); }
.ph-A { --ph: var(--phase-a); --ph-ink: var(--phase-a-ink); --ph-soft: var(--phase-a-soft); }
.ph-B { --ph: var(--phase-b); --ph-ink: var(--phase-b-ink); --ph-soft: var(--phase-b-soft); }
.ph-C { --ph: var(--phase-c); --ph-ink: var(--phase-c-ink); --ph-soft: var(--phase-c-soft); }
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.phtag { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; background: var(--ph); color: #fff; font: 700 11px/1 var(--font-data); vertical-align: 1px; }

/* engraved nameplate, like a traffolyte label on a panel door */
.plate {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--ink); color: var(--plate);
  font: 600 13px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase;
  padding: 5px 8px 4px; border-radius: 2px; white-space: nowrap;
}
.plate::before, .plate::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); opacity: .8; }
.plate-lg { font-size: 15px; padding: 7px 10px 6px; }
.plate-xl { font-size: 24px; padding: 8px 13px 7px; letter-spacing: .06em; }

/* ---------- controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px;
  padding: 8px 15px; border: 1px solid var(--rule-strong); border-radius: var(--r);
  background: var(--plate); color: var(--ink); font-weight: 500; font-size: var(--t-sm);
  cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--fix); border-color: var(--fix); color: var(--on-fix); font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: var(--fix-ink); border-color: var(--fix-ink); }
.btn-ink { background: var(--ink); border-color: var(--ink); color: var(--plate); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover:not(:disabled) { background: var(--plate-2); border-color: var(--rule); }
.btn-sm { min-height: 32px; padding: 4px 11px; font-size: var(--t-xs); }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--rule-strong); border-radius: var(--r); background: var(--plate); cursor: pointer; }
.seg { display: inline-flex; padding: 3px; background: var(--plate-2); border: 1px solid var(--rule); border-radius: var(--r); }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: var(--t-sm); font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--plate); color: var(--ink); box-shadow: var(--shadow); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.seg.small button { padding: 4px 10px; font-size: var(--t-xs); }
input[type="range"] { accent-color: var(--fix); width: 160px; }
input[type="number"], input[type="text"], select {
  font: 500 var(--t-sm) var(--font-data); color: var(--ink); background: var(--plate);
  border: 1px solid var(--rule-strong); border-radius: 6px; padding: 8px 10px; min-width: 0; min-height: 40px;
}
input[type="checkbox"] { accent-color: var(--fix); width: 18px; height: 18px; }

.chip { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font: 600 var(--t-xs)/1 var(--font-body); padding: 5px 9px 5px 7px; border-radius: 999px; border: 1px solid transparent; }
.chip .i { width: 13px; height: 13px; vertical-align: 0; }
.chip-unknown { color: var(--ink-3); border: 1px dashed var(--rule-strong); }
.chip-ok { color: var(--fix-ink); background: var(--fix-soft); }
.chip-over { color: var(--alarm); background: var(--alarm-soft); }
.chip-proposed { color: var(--fix-ink); border-color: var(--fix); background: var(--plate); }
.chip-accepted { color: var(--on-fix); background: var(--fix); }
.chip-applied { color: var(--plate); background: var(--ink); }
.chip-rejected { color: var(--ink-2); background: var(--plate-2); border-color: var(--rule); }
.chip-needs { color: var(--warn); background: var(--warn-soft); }
.chip-locked { color: var(--lock); background: var(--lock-soft); }
.lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--rule-strong); flex: none; }
.lamp-ok, .lamp-applied, .lamp-accepted { background: var(--fix); }
.lamp-proposed { background: var(--fix); box-shadow: 0 0 0 3px var(--fix-soft); }
.lamp-over { background: var(--alarm); }
.lamp-needs { background: var(--warn); }
.lamp-locked { background: var(--lock); }
.lamp-rejected { background: var(--ink-3); }

/* "show more" sections */
details.more { border-top: 1px solid var(--rule); }
details.more > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 13px 16px; cursor: pointer; font-weight: 500; font-size: var(--t-sm); color: var(--ink-2); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(-45deg); transition: transform .2s; flex: none; margin-left: 2px; }
details.more[open] > summary::before { transform: rotate(45deg); }
details.more > summary:hover { color: var(--ink); }
details.more > summary .sum-val { margin-left: auto; font: 600 var(--t-sm) var(--font-data); color: var(--ink); }
details.card-more { background: var(--plate); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); }
details.card-more > summary { padding: 15px 16px; border-top: 0; }
details.card-more[open] > summary { border-bottom: 1px solid var(--rule); }

/* ---------- frame */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; gap: 12px 22px;
  padding: 10px clamp(16px, 2.4vw, 28px);
  background: var(--plate); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand-meta { display: flex; flex-direction: column; line-height: 1.3; font-size: var(--t-xs); color: var(--ink-2); }
.dry { display: inline-flex; align-items: center; gap: 6px; color: var(--warn); font-weight: 500; }
.dry::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.pipeline { display: flex; align-items: center; margin: 0 0 0 auto; padding: 0; list-style: none; counter-reset: step; }
.pipeline li { counter-increment: step; display: flex; align-items: center; gap: 6px; font: 600 var(--t-xs)/1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); padding: 0 3px; }
.pipeline li::before { content: counter(step); display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--rule-strong); font: 600 11px/1 var(--font-data); color: var(--ink-3); background: var(--plate); }
.pipeline .wire { width: 16px; height: 2px; background: var(--rule-strong); order: -1; }
.pipeline li.done { color: var(--ink); }
.pipeline li.done::before { background: var(--fix); border-color: var(--fix); color: var(--on-fix); }
.pipeline li.now { color: var(--fix-ink); }
.pipeline li.now::before { border-color: var(--fix); color: var(--fix-ink); box-shadow: 0 0 0 3px var(--fix-soft); }
.pipeline .wire.done { background: var(--fix); }
.top-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.pipeline + .top-actions { margin-left: 0; }

.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 0 clamp(16px, 2.4vw, 28px); background: var(--plate); border-bottom: 1px solid var(--rule); }
.tabs button { border: 0; background: none; cursor: pointer; padding: 12px 14px 11px; white-space: nowrap; font: 600 var(--t-md)/1 var(--font-display); letter-spacing: .02em; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--copper); }
.tabs .count { font: 500 var(--t-xs) var(--font-data); color: var(--ink-3); margin-left: 5px; }

.bnav { display: none; }

.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); align-items: start; }
.browser { position: sticky; top: 106px; max-height: calc(100vh - 106px); overflow-y: auto; border-right: 1px solid var(--rule); background: var(--plate-2); padding-block: 14px 24px; padding-inline: 12px; display: flex; flex-direction: column; gap: 10px; }
.pb-head { font: 600 var(--t-xs)/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 0 6px; }
.pb-level { display: flex; flex-direction: column; gap: 1px; }
.pb-level-name { font: 500 var(--t-xs)/1.2 var(--font-body); color: var(--ink-3); padding: 6px 6px 3px; }
.pb-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border: 1px solid transparent; border-radius: 6px; background: transparent; cursor: pointer; text-align: left; }
.pb-item:hover { background: var(--plate); border-color: var(--rule); }
.pb-item[aria-current="true"] { background: var(--plate); border-color: var(--rule-strong); box-shadow: var(--shadow); }
.pb-item .plate { font-size: 11.5px; padding: 4px 6px 3px; gap: 5px; }
.pb-item .plate::before, .pb-item .plate::after { width: 3px; height: 3px; }
.pb-imb { margin-left: auto; font: 500 var(--t-sm) var(--font-data); }
.main { padding-block: 24px 56px; padding-inline: clamp(16px, 2.6vw, 36px); min-width: 0; outline: none; }

/* ---------- views */
.view { display: flex; flex-direction: column; gap: 18px; max-width: 1240px; }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.eyebrow { font: 600 var(--t-xs)/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--copper); margin-bottom: 6px; }
.view-head h1 { font: 600 var(--t-2xl)/1 var(--font-display); }
.lede { margin-top: 8px; font-size: var(--t-md); color: var(--ink-2); max-width: 62ch; }
.card { background: var(--plate); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 13px 16px; border-bottom: 1px solid var(--rule); }
.card-h h2 { font: 600 var(--t-md)/1.2 var(--font-display); letter-spacing: .04em; text-transform: uppercase; margin-right: auto; }
.card-sub { font-size: var(--t-xs); color: var(--ink-3); }
.card-b { padding: 14px 16px; }
.hint { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.5; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.tw { overflow-x: auto; }
.tbl { width: 100%; font-size: var(--t-sm); }
.tbl th { text-align: left; font: 600 var(--t-xs)/1.2 var(--font-body); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.sort-btn { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
.sort-btn[data-active="true"] { color: var(--ink); }
.link-btn { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }

/* newcomer explainer */
.intro { display: grid; grid-template-columns: minmax(0, 1fr) 180px; gap: 18px 28px; padding: 18px 20px; align-items: center; border-left: 4px solid var(--copper); }
.intro h2 { font: 600 var(--t-lg)/1.2 var(--font-display); margin-bottom: 10px; }
.intro ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 8px; }
.intro li { counter-increment: s; display: grid; grid-template-columns: 24px 1fr; gap: 8px; font-size: var(--t-sm); line-height: 1.5; max-width: 70ch; }
.intro li::before { content: counter(s); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--plate); font: 600 11px/1 var(--font-data); margin-top: 1px; }
.intro-foot { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.intro-viz { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: end; }
.intro-viz figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.intro-viz .bars { display: flex; align-items: flex-end; gap: 5px; height: 72px; padding: 0 6px; border-bottom: 2px solid var(--rule-strong); }
.intro-viz .bars i { width: 14px; border-radius: 2px 2px 0 0; background: var(--ph); }
.intro-viz figcaption { font-size: var(--t-xs); color: var(--ink-2); font-weight: 500; }

/* next step */
.next { display: flex; align-items: center; gap: 14px 20px; flex-wrap: wrap; padding: 16px 18px; background: var(--ink); color: var(--plate); border-radius: var(--r); box-shadow: var(--shadow); }
.next-k { font: 600 var(--t-xs)/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--copper-hi); flex: none; }
.next p { flex: 1 1 280px; font-size: var(--t-md); line-height: 1.45; }
.next .btn-primary { min-height: 44px; padding-inline: 18px; }
.next .btn-plain { background: transparent; border-color: color-mix(in srgb, var(--plate) 40%, transparent); color: var(--plate); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.stat-v { font: 600 var(--t-2xl)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat-k { font-size: var(--t-sm); color: var(--ink-2); }

/* riser */
.riser-body { position: relative; padding: 6px 16px 14px; overflow: hidden; }
.storey { position: relative; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 0 18px; min-height: 88px; border-bottom: 3px solid var(--rule-strong); padding-block: 12px; }
.storey:last-of-type { border-bottom: 0; }
.storey-tag { display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; font-size: var(--t-xs); color: var(--ink-3); }
.storey-tag b { font: 600 var(--t-md)/1 var(--font-display); color: var(--ink); letter-spacing: .03em; }
.storey-run { position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; padding-left: 20px; }
.storey-run::before { content: ""; position: absolute; left: 3px; top: -15px; bottom: -15px; width: 5px; border-radius: 1px; background: linear-gradient(90deg, var(--copper-lo), var(--copper-hi) 45%, var(--copper)); }
.storey:first-of-type .storey-run::before { top: 18px; }
.rcard { position: relative; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "plate mini" "imb mini" "chip chip"; align-items: end; gap: 6px 12px; padding: 9px 10px; min-width: 128px; background: var(--plate); border: 1px solid var(--rule-strong); border-radius: 5px; cursor: pointer; text-align: left; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
.rcard::before { content: ""; position: absolute; left: -11px; bottom: 22px; width: 10px; height: 2px; background: var(--copper); }
.rcard:first-child::before { left: -17px; width: 16px; }
.rcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.rcard .plate { grid-area: plate; justify-self: start; font-size: 12px; }
.rcard .mini { grid-area: mini; display: flex; align-items: flex-end; gap: 2px; height: 44px; width: 28px; }
.rcard .mini i { flex: 1; min-height: 2px; border-radius: 1px 1px 0 0; background: var(--ph); }
.rcard .mini.unknown i { background: var(--rule-strong); height: 40% !important; }
.rcard-imb { grid-area: imb; font: 600 var(--t-lg)/1 var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rcard-imb small { font-size: 12px; color: var(--fix-ink); font-weight: 600; }
.rcard .chip { grid-area: chip; justify-self: start; }
.rcard .stale { position: absolute; top: -8px; right: -6px; font: 600 10px/1 var(--font-body); background: var(--warn); color: var(--plate); padding: 3px 5px; border-radius: 3px; }
.rcard .cover { position: absolute; inset: -1px; display: grid; place-items: center; border-radius: 5px; background: var(--plate-2); color: var(--ink-3); font: 500 var(--t-xs) var(--font-data); border: 1px dashed var(--rule-strong); animation: uncover .35s ease-out var(--d, 0ms) both; }
@keyframes uncover { to { opacity: 0; visibility: hidden; } }
.scanline { position: absolute; left: 0; right: 0; height: 2px; bottom: 0; opacity: 0; pointer-events: none; background: var(--fix); box-shadow: 0 0 0 6px color-mix(in srgb, var(--fix) 18%, transparent), 0 0 24px 4px color-mix(in srgb, var(--fix) 35%, transparent); }
.riser.scanning .scanline { animation: scan 2.5s cubic-bezier(.45, 0, .55, 1) both; }
@keyframes scan { 0% { bottom: 0; opacity: 1; } 92% { opacity: 1; } 100% { bottom: 100%; opacity: 0; } }
.mdb { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 10px; border: 1px solid var(--rule-strong); border-radius: 5px; background: var(--plate-2); font-size: var(--t-xs); color: var(--ink-2); position: relative; }
.mdb::before { content: ""; position: absolute; left: -17px; bottom: 50%; width: 16px; height: 2px; background: var(--copper); }

/* attention list */
.att { list-style: none; margin: 0; padding: 0; }
.att li { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.att li:last-child { border-bottom: 0; }
.att .plate { justify-self: start; }
.att-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.att-line { font-size: var(--t-sm); color: var(--ink); }
.att-body .chip { align-self: flex-start; }
.att-ok { padding: 12px 16px; font-size: var(--t-sm); color: var(--ink-2); border-top: 1px solid var(--rule); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }

/* ---------- panel workspace */
.ws-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 20px; }
.ws-title { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.ws-spec { font: 500 var(--t-xs)/1.4 var(--font-data); color: var(--ink-3); }
.ws-note { font-size: var(--t-sm); color: var(--copper); font-weight: 500; }
.ws-sentence { font-size: var(--t-md); line-height: 1.5; max-width: 70ch; }
.ws-sentence b { font-family: var(--font-data); font-size: .95em; }
.panel-pick { display: none; }
.actionbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding: 12px 16px; }
.actionbar .btn-primary { min-height: 44px; padding-inline: 18px; }
.ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl-label { font: 600 var(--t-xs)/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.ctl output { font: 600 var(--t-md)/1 var(--font-data); min-width: 3.2ch; }
.actionbar details.more { border-top: 0; margin-left: auto; }
.actionbar details.more > summary { padding: 8px 4px; }
.opts { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; padding: 12px 16px 14px; border-top: 1px solid var(--rule); }
.ws-grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(320px, 1fr); gap: 18px; align-items: start; }
.ws-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

/* panelboard */
.board-wrap { padding: 14px 16px 16px; }
.board-frame { background: var(--chassis); border: 1px solid var(--rule-strong); border-radius: 10px; padding: 10px 12px 12px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25); }
.board-headrow { display: grid; grid-template-columns: minmax(0, 1fr) var(--bus) minmax(0, 1fr); align-items: end; margin-bottom: 6px; font: 600 10.5px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.board-headrow > span:last-child { text-align: right; }
.bus-labels { position: relative; height: 20px; }
.bus-labels b { position: absolute; top: 0; width: 20px; height: 20px; margin-left: -10px; display: grid; place-items: center; border-radius: 3px; color: #fff; background: var(--ph); font: 700 11px/1 var(--font-data); letter-spacing: 0; }
.bus-labels b.ph-A { left: 30%; } .bus-labels b.ph-B { left: 50%; } .bus-labels b.ph-C { left: 70%; }
.board { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) var(--bus) minmax(0, 1fr); grid-auto-rows: var(--row); row-gap: 4px; }
.bus { grid-column: 2; grid-row: 1 / -1; width: 100%; height: 100%; display: block; overflow: visible; }
.bus .bar { fill: url(#copper); }
.bus .tap { stroke-width: 3; vector-effect: non-scaling-stroke; }
.bus .tap.faint { opacity: .28; }
.bus .tap.A, .bus .stud.A { stroke: var(--phase-a); fill: var(--phase-a); }
.bus .tap.B, .bus .stud.B { stroke: var(--phase-b); fill: var(--phase-b); }
.bus .tap.C, .bus .stud.C { stroke: var(--phase-c); fill: var(--phase-c); }
.brk { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; min-width: 0; background: var(--plate); border: 1px solid var(--rule-strong); border-radius: 5px; padding: 0 0 0 8px; cursor: pointer; box-shadow: 0 1px 0 rgba(0, 0, 0, .08); transition: box-shadow .15s, border-color .15s; }
.brk.R { flex-direction: row-reverse; padding: 0 8px 0 0; text-align: right; }
.brk:hover { border-color: var(--ink-2); }
.brk-no { font: 600 var(--t-md)/1 var(--font-data); min-width: 2ch; text-align: center; }
.brk-body { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 2px; }
.brk-name { font-size: 12px; font-weight: 500; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.brk-meta { font: 400 10.5px/1.2 var(--font-data); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brk-va { display: flex; flex-direction: column; align-items: flex-end; flex: none; line-height: 1.05; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.brk.R .brk-va { align-items: flex-start; }
.brk-va b { font-size: 13px; font-weight: 600; }
.brk-va small { font-size: 9.5px; color: var(--ink-3); letter-spacing: .06em; }
.brk-lock { display: grid; place-items: center; width: 28px; height: 28px; flex: none; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--ink-3); cursor: pointer; opacity: .6; }
.brk:hover .brk-lock, .brk-lock.on, .brk-lock:focus-visible { opacity: 1; }
.brk-lock:hover { border-color: var(--rule-strong); background: var(--plate-2); }
.brk-lock.on { color: var(--lock); background: var(--lock-soft); }
.brk-lock .i { width: 14px; height: 14px; }
.brk-handle { position: relative; align-self: stretch; display: flex; flex-direction: column; gap: 4px; width: 14px; padding: 5px 0; flex: none; overflow: hidden; }
.brk.L .brk-handle { border-left: 1px solid var(--rule); margin-left: auto; border-radius: 0 4px 4px 0; }
.brk.R .brk-handle { border-right: 1px solid var(--rule); border-radius: 4px 0 0 4px; }
.brk-handle i { flex: 1; background: var(--ph); border-radius: 2px; }
.brk.multi .brk-handle::after { content: ""; position: absolute; left: 50%; top: 10px; bottom: 10px; width: 3px; margin-left: -1.5px; background: var(--ink); opacity: .55; border-radius: 2px; }
.brk.locked { background-image: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--lock) 9%, transparent) 7px 8px); }
.brk.spare { background: var(--plate-2); border-style: dashed; }
.brk.spare .brk-name { color: var(--ink-2); font-style: italic; }
.brk.zero .brk-meta, .brk.zero .brk-va b { color: var(--warn); }
.brk.sel { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.brk.pending { border: 1.5px dashed var(--fix); }
.brk.moved { border: 2px solid var(--fix); box-shadow: 0 0 0 4px var(--fix-soft); }
.brk.flying { z-index: 5; box-shadow: var(--shadow-lift), 0 0 0 4px var(--fix-soft); }
.was, .pend { font: 600 10px/1 var(--font-data); padding: 3px 5px; border-radius: 3px; white-space: nowrap; }
.was { color: var(--on-fix); background: var(--fix); }
.pend { color: var(--fix-ink); background: var(--plate); border: 1px dashed var(--fix); }
.brk .was, .brk .pend { position: absolute; top: -9px; z-index: 2; }
.brk.L .was, .brk.L .pend { right: 44px; }
.brk.R .was, .brk.R .pend { left: 44px; }
.brk.eval { animation: evalpulse 1.1s ease-in-out var(--d, 0ms) 2; }
@keyframes evalpulse { 0%, 100% { box-shadow: 0 1px 0 rgba(0, 0, 0, .08); } 50% { box-shadow: 0 0 0 3px var(--fix-soft), 0 0 0 4px var(--fix); } }
.space { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px; border: 1px dashed color-mix(in srgb, var(--ink-3) 55%, transparent); border-radius: 5px; font: 500 10.5px/1 var(--font-data); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.space.R { flex-direction: row-reverse; }
.space.ghost { border: 1.5px dashed var(--fix); color: var(--fix-ink); background: color-mix(in srgb, var(--fix) 7%, transparent); text-transform: none; letter-spacing: 0; }
.g-short { display: none; }
.board-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0 16px 14px; font-size: var(--t-xs); color: var(--ink-2); }
.board-legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-box { width: 18px; height: 12px; border-radius: 2px; display: inline-block; border: 1px solid var(--rule-strong); background: var(--plate); flex: none; }
.lg-box.moved { border: 2px solid var(--fix); }
.lg-box.pending { border: 1.5px dashed var(--fix); }
.lg-box.locked { background-image: repeating-linear-gradient(135deg, transparent 0 3px, var(--lock) 3px 4px); }

.sched-wrap { padding: 14px 16px 16px; overflow-x: auto; }
.sched { width: 100%; min-width: 600px; font-size: var(--t-sm); }
.sched th { font: 600 10.5px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 7px 6px; border-bottom: 1.5px solid var(--ink); text-align: left; white-space: nowrap; }
.sched td { padding: 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.sched .ckt { font: 600 var(--t-sm) var(--font-data); width: 3ch; text-align: center; }
.sched .desc { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
.sched .pc { font: 500 11.5px var(--font-data); text-align: center; width: 80px; color: var(--ink-3); }
.sched .pc.live { color: var(--ink); background: var(--ph-soft); font-weight: 600; }
.sched th.pc { text-align: center; color: var(--ink); }
.sched .va { font: 500 var(--t-sm) var(--font-data); text-align: right; }
.sched .side-moved { background: var(--fix-soft); }
.sched tfoot td { font: 600 var(--t-sm) var(--font-data); border-top: 1.5px solid var(--ink); border-bottom: 0; }
.sched .muted { color: var(--ink-3); }
.sched .was, .sched .pend { display: inline-block; margin-left: 4px; }

/* balance card */
.bal { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.bal-top { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.k { display: block; font: 600 var(--t-xs)/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.imb-big { font: 600 var(--t-3xl)/.9 var(--font-display); font-variant-numeric: tabular-nums; }
.imb-before { font: 600 var(--t-xl)/1 var(--font-display); color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 2px; }
.imb-arrow { color: var(--ink-3); padding-bottom: 6px; }
.bal-note { font-size: var(--t-xs); color: var(--ink-2); }
.pl { display: flex; flex-direction: column; gap: 12px; }
.pl-row { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: center; }
.pl-tag { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 4px; background: var(--ph); color: #fff; font: 700 12px/1 var(--font-data); }
.pl-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pl-track { position: relative; height: 18px; }
.pl-band { position: absolute; top: -3px; bottom: -3px; background: var(--fix-soft); border-left: 1px solid var(--fix); border-right: 1px solid var(--fix); }
.pl-avg { position: absolute; top: -5px; bottom: -5px; width: 0; border-left: 1.5px dashed var(--ink-2); }
.pl-before { position: absolute; left: 0; top: 2px; height: 14px; border: 1.5px dashed var(--ph); border-radius: 2px; }
.pl-bar { position: absolute; left: 0; top: 2px; height: 14px; background: var(--ph); border-radius: 2px; transition: width .9s cubic-bezier(.3, 0, .2, 1); }
.pl-vals { font: 500 11.5px/1.2 var(--font-data); color: var(--ink-2); }
.pl-vals b { color: var(--ink); font-weight: 600; }
.pl-foot { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--t-xs); color: var(--ink-2); }
.pl-foot span { display: inline-flex; align-items: center; gap: 6px; }

.phasor-wrap { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 14px; padding: 14px 16px 16px; align-items: center; }
.phasor { width: 160px; height: 160px; overflow: visible; }
.phasor .ring { fill: none; stroke: var(--rule); stroke-width: 1; }
.phasor .axis { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 2 3; }
.phasor .vec { stroke-width: 3.5; stroke-linecap: round; }
.phasor .vec.A { stroke: var(--phase-a); } .phasor .vec.B { stroke: var(--phase-b); } .phasor .vec.C { stroke: var(--phase-c); } .phasor .vec.N { stroke: var(--ink); stroke-width: 4.5; }
.phasor .head.A { fill: var(--phase-a); } .phasor .head.B { fill: var(--phase-b); } .phasor .head.C { fill: var(--phase-c); } .phasor .head.N { fill: var(--ink); }
.phasor text { font: 600 11px var(--font-data); fill: var(--ink-2); }

.insp { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.insp-grid { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; font-size: var(--t-sm); margin: 0; }
.insp-grid dt { color: var(--ink-3); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.insp-grid dd { margin: 0; }
.insp-grid input[type="number"] { width: 120px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: var(--t-sm); }
.sheet-tag { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; font: 500 11px/1 var(--font-data); padding: 3px 6px; border-radius: 3px; border: 1px solid var(--rule-strong); margin: 0 4px 4px 0; }
.sheet-tag.issued { border-color: var(--warn); color: var(--warn); }

/* proposed fix */
.review-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.fix { overflow: hidden; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; font-size: var(--t-sm); border-bottom: 1px solid var(--rule); }
.banner .i { margin-top: 2px; }
.banner p { color: var(--ink); }
.banner-needs, .banner-warn { background: var(--warn-soft); color: var(--warn); }
.banner-locked { background: var(--lock-soft); color: var(--lock); }
.banner-ok { background: var(--fix-soft); color: var(--fix-ink); }
.moves { list-style: none; margin: 0; padding: 4px 16px; }
.moves li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.moves li:last-child { border-bottom: 0; }
.mv-no { display: grid; place-items: center; height: 40px; border-radius: 6px; background: var(--plate-2); border: 1px solid var(--rule-strong); font: 600 var(--t-md) var(--font-data); }
.mv-name { font-weight: 600; }
.mv-name span { font-weight: 400; color: var(--ink-2); font-family: var(--font-data); font-size: var(--t-sm); }
.mv-path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 3px; font: 500 var(--t-sm) var(--font-data); color: var(--ink-2); }
.mv-path b { color: var(--fix-ink); }
.fix-explain { padding: 12px 16px; font-size: var(--t-sm); line-height: 1.6; color: var(--ink); background: var(--plate-2); border-top: 1px solid var(--rule); }
.fix-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-top: 1px solid var(--rule); }
.fix-foot .metrics { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 var(--t-xs) var(--font-data); color: var(--ink-2); margin-right: auto; }
.fix-foot .metrics b { color: var(--ink); }
.empty-state { padding: 22px 16px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; color: var(--ink-2); font-size: var(--t-sm); }
.trace ol { list-style: none; margin: 0; padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 10px; counter-reset: it; }
.trace li { position: relative; padding-left: 28px; font-size: var(--t-sm); line-height: 1.5; }
.trace li::before { counter-increment: it; content: counter(it); position: absolute; left: 0; top: 1px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--plate); font: 600 10px/1 var(--font-data); }
.trace li.stop::before { content: "■"; background: var(--fix); color: var(--on-fix); font-size: 8px; }
.trace li.reveal { animation: rise .45s ease-out var(--d, 0ms) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.trace .note { padding: 4px 16px 16px; }

/* compare */
.cmp-pitch { font: 600 var(--t-xl)/1.2 var(--font-display); max-width: 40ch; margin-top: 10px; text-wrap: balance; }
.cmp-pitch em { font-style: normal; color: var(--fix-ink); }
.cmp-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
.cmp-col.best { border-color: var(--fix); box-shadow: 0 0 0 1px var(--fix), var(--shadow); }
.cmp-col .card-h h2 { font-size: var(--t-md); }
.cmp-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border-bottom: 1px solid var(--rule); }
.cmp-stats > div { background: var(--plate); padding: 12px 14px; }
.cmp-stats .v { font: 600 var(--t-2xl)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.slotmap { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 4px; padding: 14px; }
.sm { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px; border-radius: 3px; font: 500 10.5px/1 var(--font-data); background: var(--plate-2); color: var(--ink-3); border: 1px solid transparent; overflow: hidden; white-space: nowrap; }
.sm.load { background: var(--ph-soft); color: var(--ink); border-color: color-mix(in srgb, var(--ph) 40%, transparent); }
.sm.load::before { content: ""; width: 4px; align-self: stretch; margin: 3px 0; border-radius: 1px; background: var(--ph); }
.sm.moved { border: 2px solid var(--fix); box-shadow: 0 0 0 2px var(--fix-soft); }
.sm.locked { background-image: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--lock) 18%, transparent) 5px 6px); }
.sm b { font-weight: 600; }
.sm .va { margin-left: auto; }
.cmp-foot { padding: 0 14px 14px; font-size: var(--t-xs); color: var(--ink-2); }

/* report */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.kpi .kid { font: 600 var(--t-xs)/1 var(--font-data); color: var(--copper); }
.kpi .kname { font-size: var(--t-sm); font-weight: 500; line-height: 1.3; }
.kpi .kval { font: 600 var(--t-2xl)/1 var(--font-display); font-variant-numeric: tabular-nums; margin-top: auto; }
.kpi .kval.na { font: 500 var(--t-sm)/1.35 var(--font-body); color: var(--ink-3); }
.kpi .ktarget { font: 500 var(--t-xs) var(--font-data); color: var(--ink-3); }
.kpi .chip { align-self: flex-start; }
.tx-list, .logc { list-style: none; margin: 0; padding: 0; }
.tx-list li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 11px 16px; border-bottom: 1px solid var(--rule); font-size: var(--t-sm); }
.tx-list li:last-child { border-bottom: 0; }
.tx-list .tname { font: 500 var(--t-sm) var(--font-data); margin-right: auto; }
.tx-list .undone .tname { text-decoration: line-through; color: var(--ink-3); }
.logc li { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--rule); font-size: var(--t-sm); }
.logc li:last-child { border-bottom: 0; }
.logc .plate { justify-self: start; }
.logc .lg-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.logc .lg-sub { font: 400 var(--t-xs) var(--font-data); color: var(--ink-3); overflow-wrap: anywhere; }
.logc time { font: 500 var(--t-xs) var(--font-data); color: var(--ink-3); }
.csv { margin: 0; padding: 14px 16px; font: 400 11.5px/1.55 var(--font-data); white-space: pre; overflow-x: auto; color: var(--ink-2); max-height: 260px; }
.csv-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 14px; }
.activity { list-style: none; margin: 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
.activity li { display: grid; grid-template-columns: 64px 1fr; gap: 8px; font-size: var(--t-xs); line-height: 1.45; color: var(--ink-2); }
.activity time { font-family: var(--font-data); color: var(--ink-3); }
.activity .k-ok span { color: var(--fix-ink); } .activity .k-alarm span { color: var(--alarm); } .activity .k-warn span { color: var(--warn); }

/* settings */
.cfg-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.form { display: grid; grid-template-columns: minmax(150px, auto) 1fr; gap: 12px 16px; padding: 14px 16px 16px; align-items: center; font-size: var(--t-sm); }
.form label { color: var(--ink-2); }
.json { margin: 0; padding: 14px 16px; font: 400 12px/1.6 var(--font-data); white-space: pre; overflow-x: auto; background: var(--plate-2); }
.json .k1 { color: var(--phase-c-ink); } .json .v1 { color: var(--copper); }
.tests { list-style: none; margin: 0; padding: 6px 16px 14px; }
.tests li { display: grid; grid-template-columns: 22px 34px 1fr; gap: 8px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: var(--t-sm); }
.tests li:last-child { border-bottom: 0; }
.tests .pass { color: var(--fix-ink); } .tests .fail { color: var(--alarm); }
.tests .tid { font: 600 var(--t-xs) var(--font-data); color: var(--ink-3); }
.tests .detail { display: block; font: 400 11px var(--font-data); color: var(--ink-3); }
.rules-list { list-style: none; margin: 0; padding: 0; }
.rules-list li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding: 12px 16px; border-bottom: 1px solid var(--rule); font-size: var(--t-sm); }
.rules-list li:last-child { border-bottom: 0; }
.rules-list .rid { font: 600 var(--t-sm) var(--font-data); }
.rules-list .how { display: block; color: var(--ink-3); font-size: var(--t-xs); margin-top: 2px; }
.type { font: 600 10px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; background: var(--plate-2); border: 1px solid var(--rule); white-space: nowrap; }
.type.hard { background: var(--ink); color: var(--plate); border-color: var(--ink); }
.assume { list-style: none; margin: 0; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.assume label { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; font-size: var(--t-sm); cursor: pointer; }
.assume input { margin-top: 2px; }

/* presenter */
.presenter { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--ink); color: var(--plate); border-top: 3px solid var(--copper); padding: 12px clamp(16px, 2.4vw, 28px) calc(12px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 26px rgba(0, 0, 0, .25); }
.pz { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 24px; align-items: center; max-width: 1400px; margin: 0 auto; }
.pz-progress { grid-column: 1 / -1; display: flex; gap: 3px; }
.pz-progress button { flex: 1; height: 6px; border: 0; padding: 0; border-radius: 2px; background: color-mix(in srgb, var(--plate) 22%, transparent); cursor: pointer; }
.pz-progress button.done { background: var(--copper); }
.pz-progress button.now { background: var(--copper-hi); }
.pz-step { font: 500 var(--t-xs)/1 var(--font-data); opacity: .7; margin-bottom: 4px; }
.pz-title { font: 600 var(--t-lg)/1.15 var(--font-display); }
.pz-caption { font-size: var(--t-base); line-height: 1.5; opacity: .92; margin-top: 4px; max-width: 90ch; }
.pz-ctl { display: flex; gap: 8px; flex-wrap: wrap; }
.pz-ctl .btn { background: transparent; color: var(--plate); border-color: color-mix(in srgb, var(--plate) 35%, transparent); }
.pz-ctl .btn:hover:not(:disabled) { border-color: var(--plate); }
.pz-ctl .btn-primary { background: var(--copper); border-color: var(--copper); color: #fff; }
.pz-ctl .btn-primary:hover:not(:disabled) { background: var(--copper-lo); border-color: var(--copper-lo); }

.toast { position: fixed; right: 16px; bottom: calc(16px + var(--bnav) + env(safe-area-inset-bottom, 0px)); z-index: 50; max-width: min(420px, calc(100vw - 32px)); padding: 11px 15px; border-radius: 8px; background: var(--ink); color: var(--plate); font-size: var(--t-sm); box-shadow: var(--shadow-lift); opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: none; }
body.touring .toast { bottom: 200px; }

/* ---------- responsive */
@media (max-width: 1280px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pipeline { display: none; }
}
@media (max-width: 1180px) {
  .ws-grid, .review-grid, .cfg-grid { grid-template-columns: minmax(0, 1fr); }
  .ws-side { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .cmp-grid { grid-template-columns: 1fr 1fr; }
  .cmp-grid > .cmp-col:first-child { grid-column: 1 / -1; }
}
@media (max-width: 1000px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .browser { display: none; }
  .panel-pick { display: flex; align-items: center; gap: 8px; }
}
/* phone: app-style navigation and a compact board that fits the screen */
@media (max-width: 720px) {
  :root { --bnav: 64px; --bus: 60px; --t-2xl: 30px; --t-3xl: 46px; }
  .tabs { display: none; }
  .top { position: sticky; padding: 8px 14px; gap: 10px; }
  .brand-meta { display: none; }
  .plate-lg { font-size: 13px; padding: 6px 8px 5px; }
  .top-actions .btn-ink span { display: none; }
  .bnav {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
    background: var(--plate); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bnav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: var(--bnav); border: 0; background: none; color: var(--ink-3); font: 600 10.5px/1 var(--font-body); cursor: pointer; position: relative; }
  .bnav button .i { width: 22px; height: 22px; }
  .bnav button[aria-current="page"] { color: var(--ink); }
  .bnav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--copper); }
  .bnav .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--fix); color: var(--on-fix); font: 600 10px/16px var(--font-data); }
  body.touring .bnav { display: none; }
  .main { padding-block: 16px 28px; }
  .view { gap: 14px; }
  .intro { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  .intro-viz { max-width: 220px; }
  .intro-viz .bars { height: 48px; }
  .next { padding: 14px; }
  .next .btn-primary, .next .btn-plain { width: 100%; }
  .stat { padding: 12px; }
  .stat-k { font-size: var(--t-xs); }
  .storey { grid-template-columns: minmax(0, 1fr); }
  .storey-tag { flex-direction: row; justify-content: flex-start; gap: 8px; align-items: baseline; padding-bottom: 8px; }
  .storey { min-height: 0; }
  .rcard .mini { height: 34px; width: 24px; }
  .rcard-imb { font-size: var(--t-md); }
  .storey-run { display: grid; grid-template-columns: 1fr 1fr; }
  .rcard { min-width: 0; }
  .att li { grid-template-columns: minmax(0, 1fr); padding: 14px 16px; }
  .att li > .actions { justify-content: flex-start; }
  .actionbar { flex-direction: column; align-items: stretch; }
  .actionbar .btn-primary { width: 100%; }
  .actionbar details.more { margin-left: 0; }
  .ctl { justify-content: space-between; }
  input[type="range"] { flex: 1; width: auto; }
  .board-wrap { padding: 10px; }
  .board-frame { padding: 8px 6px; }
  .board-headrow { font-size: 9px; letter-spacing: .06em; }
  .brk { gap: 4px; padding-left: 6px; }
  .brk.R { padding-right: 6px; }
  .brk-body { display: none; }
  .brk-va { margin-left: auto; }
  .brk.R .brk-va { margin-left: 0; margin-right: auto; }
  .brk-va small { display: none; }
  .brk-lock { width: 26px; height: 26px; }
  .brk.L .was, .brk.L .pend, .brk.R .was, .brk.R .pend { left: 50%; right: auto; transform: translateX(-50%); }
  .hide-m { display: none; }
  .space { padding: 0 8px; }
  .space .g-long, .space .sp-word { display: none; }
  .space .g-short { display: inline; }
  .bal-top .imb-before { font-size: var(--t-lg); }
  .phasor-wrap { grid-template-columns: 120px minmax(0, 1fr); }
  .phasor { width: 120px; height: 120px; }
  .moves li { grid-template-columns: 38px minmax(0, 1fr); }
  .fix-foot .actions { width: 100%; }
  .fix-foot .actions .btn { flex: 1; }
  .cmp-pitch { font-size: var(--t-lg); }
  .cmp-grid, .kpis { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cmp-grid > .cmp-col { grid-column: 1 / -1; }
  .kpi { padding: 12px; }
  .kpi:nth-child(4) { order: 5; grid-column: 1 / -1; }
  .cmp-col:first-child .slotmap, .cmp-col:first-child .cmp-foot { display: none; }
  .bus-labels b { width: 15px; height: 17px; margin-left: -7.5px; font-size: 9.5px; }
  .logc li { grid-template-columns: minmax(0, 1fr) auto; }
  .logc li .plate { grid-row: 1; }
  .logc li .lg-main { grid-column: 1 / -1; }
  .form { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .form label { margin-top: 8px; }
  .rules-list li { grid-template-columns: 34px minmax(0, 1fr); }
  .rules-list .type { grid-column: 2; justify-self: start; }
  .pz { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .pz-title { font-size: var(--t-md); }
  .pz-caption { font-size: var(--t-sm); }
  .pz-ctl .btn { min-height: 36px; padding: 5px 11px; flex: 1; }
  body.touring { padding-bottom: 230px; }
  body.touring .toast { bottom: 240px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="copper" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8A4D20"/><stop offset=".45" stop-color="#E2A06A"/><stop offset="1" stop-color="#A9622E"/>
    </linearGradient>
  </defs>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-change" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 3v18M7 7h2M7 11h2M7 15h2M15 7h2M15 11h2M15 15h2"/></symbol>
  <symbol id="i-compare" viewBox="0 0 24 24"><rect x="3" y="5" width="7" height="14" rx="1.5"/><rect x="14" y="5" width="7" height="14" rx="1.5"/></symbol>
  <symbol id="i-report" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17.2v.3"/></symbol>
</svg>

<div class="app" id="app">
  <header class="top" id="top"></header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
  <div class="shell">
    <aside class="browser" id="browser" aria-label="Panels"></aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>
<nav class="bnav" id="bnav" aria-label="Views"></nav>
<div class="presenter" id="presenter" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">This dry run needs JavaScript to simulate the copilot.</p></noscript>

<script src="src/phase_balancer.js"></script>
<script src="src/panel_model.js"></script>
<script src="src/sample_project.js"></script>
<script src="src/app.js"></script>
